name: simple-todo-list-pro

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: simple_todo_list
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./back-end/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' simple_todo_list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./back-end
    environment:
      STDL_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      STDL_DATASOURCE_HOST: mysql
      STDL_DATASOURCE_PORT: "3306"
      STDL_DATASOURCE_DATABASE: simple_todo_list
      STDL_DATASOURCE_USERNAME: root
      STDL_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      STDL_JWT_SECRET_KEY: ${STDL_JWT_SECRET_KEY:?Set STDL_JWT_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./front-end
    environment:
      VITE_BACKEND_URL: http://backend:8088
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
